name: Build

on:
  workflow_dispatch:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Lint
        run: |
          ./gradlew ktlintCheck
      - name: Detekt
        run: |
          ./gradlew detekt
      - name: Build
        run: |
          ./gradlew build --info
      # Publish to the staging dir and assert the artifact lands at the
      # correct coordinates (com/wire/wire-apps-jvm-sdk/<version>/pom).
      # Catches publication/coordinate regressions at PR time instead of
      # release time, without uploading anything.
      - name: Publication check
        run: |
          set -euo pipefail
          rm -rf build/maven-publish
          ./gradlew :lib:publishMavenPublicationToWireStagingRepository -PskipSigning=true --no-configuration-cache
          POM="$(find build/maven-publish/com/wire/wire-apps-jvm-sdk -name 'wire-apps-jvm-sdk-*.pom' | head -1)"
          test -n "$POM" || { echo "error: no POM published under com/wire/wire-apps-jvm-sdk" >&2; exit 1; }
          echo "Publication check passed: $POM"
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
