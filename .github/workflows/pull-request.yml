name: Build

on:
  workflow_dispatch:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v7.0.1
      - uses: actions/setup-java@v5.5.0
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Lint
        run: |
          ./gradlew ktlintCheck
      - name: Detekt
        run: |
          ./gradlew detekt
      - name: Build
        run: |
          ./gradlew build --info
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
