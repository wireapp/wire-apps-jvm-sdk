name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::093205192929:role/gh-actions-maven-publish-wire-apps-jvm-sdk
          aws-region: us-east-1

      # Seed the publish dir with the current repository state so Gradle
      # reads and merges the existing maven-metadata.xml instead of
      # overwriting the bucket's version history with a fresh one.
      # An empty (first-release) prefix is a no-op that exits 0.
      - name: Seed publish dir from S3
        run: |
          set -euo pipefail
          aws s3 sync s3://maven-wire-com/com/wire/wire-apps-jvm-sdk/ build/maven-publish/com/wire/wire-apps-jvm-sdk/ --no-progress

      - name: Publish artifacts
        run: ./gradlew :lib:publishMavenPublicationToWireStagingRepository --no-configuration-cache --info
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

      # Upload immutable release artifacts first and update the mutable
      # Maven metadata only after every artifact upload succeeds. Metadata
      # checksums are intentionally omitted because they cannot be overwritten.
      - name: Upload artifacts to S3
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          ARTIFACT_ROOT="build/maven-publish/com/wire/wire-apps-jvm-sdk"
          test -d "${ARTIFACT_ROOT}/${VERSION}" || {
            echo "error: no artifacts published for com.wire:wire-apps-jvm-sdk:${VERSION}" >&2
            exit 1
          }
          aws s3 cp \
            "${ARTIFACT_ROOT}/${VERSION}/" \
            "s3://maven-wire-com/com/wire/wire-apps-jvm-sdk/${VERSION}/" \
            --recursive \
            --no-overwrite \
            --no-progress
          aws s3 cp \
            "${ARTIFACT_ROOT}/maven-metadata.xml" \
            "s3://maven-wire-com/com/wire/wire-apps-jvm-sdk/maven-metadata.xml" \
            --no-progress

      - name: Update README.md with new version
        continue-on-error: true
        run: |
          set -euo pipefail
          VERSION="${{ github.event.release.tag_name }}"
          echo "Updating dependency sections in README.md with version ${VERSION}"

          # Update Gradle dependency section
          sed -i -E 's|implementation\("com\.wire:wire-apps-jvm-sdk:[^"]+"\)|implementation("com.wire:wire-apps-jvm-sdk:'"$VERSION"'")|g' README.md

          # Update Maven dependency section (only within the com.wire:wire-apps-jvm-sdk dependency block)
          sed -i -E '/<groupId>com\.wire<\/groupId>/,/<\/dependency>/{
            /<artifactId>wire-apps-jvm-sdk<\/artifactId>/,/<\/dependency>/{
              s|<version>[^<]+</version>|<version>'"$VERSION"'</version>|g
            }
          }' README.md

      - name: Commit README.md changes and create PR
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "docs(readme): update dependency version to ${{ github.event.release.tag_name }}"
          branch: "update-readme-${{ github.event.release.tag_name }}"
          title: "docs(readme): update dependency version to ${{ github.event.release.tag_name }}"
          body: |
            This PR updates the README.md dependency sections to version ${{ github.event.release.tag_name }}.
          labels: automated

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
